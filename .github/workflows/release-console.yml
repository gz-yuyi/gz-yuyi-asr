name: Release console HTML

on:
  push:
    tags:
      - 'console-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-console-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-console:
    name: Build and release console
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone console
        run: npm run build:console

      - name: Prepare release asset
        id: release_meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          version_tag="v${version}"
          release_tag="console-${version_tag}"
          asset="yuyi-asr-test-console-${version_tag}.html"
          title="Console HTML ${version_tag}"
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE}"

          if [[ "${ref_type}" == "tag" && "${ref_name}" != "${release_tag}" ]]; then
            echo "Tag ${ref_name} does not match package version release tag ${release_tag}." >&2
            exit 1
          fi

          cp dist/test-console.html "${asset}"

          {
            echo "tag=${release_tag}"
            echo "asset=${asset}"
            echo "version=${version_tag}"
            echo "title=${title}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "语义科技ASR 测试控制台"
            echo
            echo "- 版本: ${version_tag}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Standalone HTML: ${asset}"
            echo
            echo "下载 HTML 后可避开 GitHub Pages HTTPS 页面访问 HTTP API 的 mixed-content 限制。"
            echo
            echo "若直接双击打开时浏览器因 CORS 拦截请求，可在下载目录运行本地 HTTP 服务后访问，并在后端允许该本地来源："
            echo
            echo '```bash'
            echo 'python3 -m http.server 5177'
            echo '```'
            echo
            echo "## 变更记录"
          } > release-notes.md

          awk -v heading="${version_tag}" '
            BEGIN { in_section=0; emitted=0 }
            $0 == "## [" heading "]" || $0 ~ ("^## \\[" heading "\\] - ") { in_section=1; next }
            /^## \[/ && in_section { in_section=0 }
            in_section {
              print
              if ($0 !~ /^[[:space:]]*$/) emitted=1
            }
            END {
              if (!emitted) print "\n未找到 " heading " 的更新日志条目。"
            }
          ' CHANGELOG.md >> release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          ASSET: ${{ steps.release_meta.outputs.asset }}
          TITLE: ${{ steps.release_meta.outputs.title }}
        shell: bash
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "${TAG}" "${ASSET}" \
            --target "${GITHUB_SHA}" \
            --title "${TITLE}" \
            --notes-file release-notes.md
