name: Release console HTML

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-console-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-console:
    name: Build and release console
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone console
        run: npm run build:console

      - name: Prepare release asset
        id: release_meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE}"

          if [[ "${ref_type}" == "tag" ]]; then
            safe_ref="$(printf '%s' "${ref_name}" | tr '/ ' '--' | tr -c 'A-Za-z0-9._-' '-')"
            release_tag="${ref_name}"
            asset="yuyi-asr-test-console-${safe_ref}.html"
            title="Console HTML ${ref_name}"
            prerelease="false"
            release_kind="正式 release"
          else
            release_tag="console-latest"
            asset="yuyi-asr-test-console-latest.html"
            title="Console HTML latest (${short_sha})"
            prerelease="true"
            release_kind="latest pre-release"
          fi

          cp dist/test-console.html "${asset}"

          {
            echo "tag=${release_tag}"
            echo "asset=${asset}"
            echo "short_sha=${short_sha}"
            echo "title=${title}"
            echo "prerelease=${prerelease}"
            echo "release_kind=${release_kind}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "语义科技ASR 测试控制台"
            echo
            echo "- 类型: ${release_kind}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Standalone HTML: ${asset}"
            echo
            echo "下载 HTML 后可避开 GitHub Pages HTTPS 页面访问 HTTP API 的 mixed-content 限制。"
            echo
            echo "若直接双击打开时浏览器因 CORS 拦截请求，可在下载目录运行本地 HTTP 服务后访问，并在后端允许该本地来源："
            echo
            echo '```bash'
            echo 'python3 -m http.server 5177'
            echo '```'
          } > release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          ASSET: ${{ steps.release_meta.outputs.asset }}
          TITLE: ${{ steps.release_meta.outputs.title }}
          PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
        shell: bash
        run: |
          if [[ "${PRERELEASE}" == "true" ]]; then
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release delete "${TAG}" --cleanup-tag --yes
            fi
            gh release create "${TAG}" "${ASSET}" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --prerelease
          else
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists; leaving it unchanged."
              exit 0
            fi
            gh release create "${TAG}" "${ASSET}" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes-file release-notes.md
          fi
