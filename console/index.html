<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>语义科技ASR 测试控制台</title>
    <script type="module">
const template = '  <div class="toast-container" id="toasts"></div>\n  <div class="app">\n    <nav class="sidebar">\n      <div class="brand">\n        <h1>语义科技ASR</h1>\n        <div>ASR 测试控制台</div>\n      </div>\n      <button class="nav-item active" data-panel="offline"><span class="nav-icon">&#9776;</span>离线任务</button>\n      <button class="nav-item" data-panel="realtime"><span class="nav-icon">&#9654;</span>实时转写</button>\n      <button class="nav-item" data-panel="browser"><span class="nav-icon">&#128269;</span>任务浏览器</button>\n      <button class="nav-item" data-panel="speakers"><span class="nav-icon">&#9783;</span>声纹管理</button>\n      <button class="nav-item" data-panel="hotwords"><span class="nav-icon">&#9733;</span>热词管理</button>\n      <button class="nav-item" data-panel="status"><span class="nav-icon">&#9673;</span>系统状态</button>\n      <button class="nav-item" data-panel="settings"><span class="nav-icon">&#9881;</span>连接配置</button>\n    </nav>\n\n    <main class="main">\n      <section class="panel" id="panel-realtime">\n        <h2 class="section-title">实时 WebSocket 转写</h2>\n\n        <div class="card">\n          <div class="card-header">\n            <div>\n              <div class="card-title">音频源</div>\n              <div class="card-desc">支持浏览器上传文件分块发送，也支持麦克风实时 PCM 流</div>\n            </div>\n            <div class="status-bar">\n              <div class="chip warn" id="wsChip">\n                <span class="chip-dot"></span>\n                <span id="wsChipLabel">未连接</span>\n              </div>\n              <span class="stats-label" id="statsLabel">chunks: 0 · messages: 0</span>\n            </div>\n          </div>\n\n          <div class="source-tabs">\n            <button class="source-tab active" data-source="file">文件上传</button>\n            <button class="source-tab" data-source="mic">麦克风</button>\n          </div>\n\n          <div class="source-panel active" id="source-file">\n            <div class="form-grid">\n              <div class="fg c6">\n                <label>音频文件</label>\n                <input id="realtimeFile" type="file" accept=".wav,.mp3,.m4a,.aac,.opus,.pcm,audio/*">\n              </div>\n              <div class="fg c3">\n                <label>发送模式</label>\n                <select id="streamMode">\n                  <option value="decode_pcm">浏览器解码 PCM</option>\n                  <option value="raw_chunked">裸 PCM16LE 分块</option>\n                </select>\n              </div>\n              <div class="fg c3">\n                <label>audio_encoding</label>\n                <select id="audioEncoding">\n                  <option value="pcm_s16le">pcm_s16le</option>\n                </select>\n              </div>\n              <div class="fg c12">\n                <label>音频 URL</label>\n                <input id="realtimeAudioUrl" placeholder="可选，用于从本地或远程 HTTP 地址加载音频">\n              </div>\n            </div>\n\n            <div class="waveform-container" id="waveformWrap">\n              <canvas id="waveformCanvas"></canvas>\n              <div class="waveform-overlay" id="waveformPlaceholder">选择音频文件以预览波形</div>\n            </div>\n            <div class="waveform-info" id="waveformInfo"></div>\n\n            <div class="btn-row">\n              <button class="btn-primary" id="connectBtn">连接并发送</button>\n              <button class="btn-ghost" id="connectUrlBtn">加载 URL 并发送</button>\n              <button class="btn-ghost" id="playAudioBtn" disabled>试听</button>\n              <button class="btn-ghost" id="stopAudioBtn" disabled>停止试听</button>\n            </div>\n\n            <div class="progress-bar" id="sendProgress">\n              <div class="progress-fill" id="sendProgressFill"></div>\n            </div>\n          </div>\n\n          <div class="source-panel" id="source-mic">\n            <div class="mic-hero" id="micHero">\n              <div class="mic-circle" id="micCircle">\n                <span class="mic-icon">MIC</span>\n              </div>\n              <div class="mic-hero-text" id="micHeroText">点击下方按钮开始录制</div>\n              <div class="mic-timer hidden" id="micTimerWrap">\n                <span class="mic-pulse"></span>\n                <span id="micTimerLabel">00:00</span>\n              </div>\n            </div>\n\n            <div class="btn-row centered">\n              <button class="btn-success" id="micBtn">开始录制</button>\n              <button class="btn-danger hidden" id="micStopBtn">停止录制</button>\n              <button class="btn-ghost hidden" id="micDownloadBtn">下载录音</button>\n            </div>\n            <div class="card-desc centered-text" id="micDownloadHint">原始采集（EC/NS/AGC 关闭）；结束后可下载实际发送的 16k PCM</div>\n          </div>\n\n          <div class="live-wave-container" id="liveWaveWrap">\n            <canvas id="liveWaveCanvas"></canvas>\n          </div>\n\n          <div class="divider"></div>\n          <div class="btn-row">\n            <button class="btn-ghost" id="pingBtn">Ping</button>\n            <button class="btn-warn" id="stopBtn">FinishSession</button>\n            <button class="btn-danger" id="closeBtn">断开连接</button>\n          </div>\n        </div>\n\n        <div class="card">\n          <div class="card-header">\n            <div>\n              <div class="card-title">流参数</div>\n              <div class="card-desc">控制 PCM 分块、说话人、热词和文本规整参数</div>\n            </div>\n          </div>\n\n          <div class="form-grid">\n            <div class="fg c2">\n              <label>sample_rate</label>\n              <input id="sampleRate" type="number" value="16000">\n            </div>\n            <div class="fg c2">\n              <label>chunk (ms)</label>\n              <input id="chunkMs" type="number" value="100">\n            </div>\n            <div class="fg c2">\n              <label>sleep (ms)</label>\n              <input id="sleepMs" type="number" value="100">\n            </div>\n            <div class="fg c2">\n              <label>raw chunk bytes</label>\n              <input id="rawChunkBytes" type="number" value="65536">\n            </div>\n            <div class="fg c2">\n              <label>enable_speaker</label>\n              <select id="enableSpeaker">\n                <option value="true" selected>true</option>\n                <option value="false">false</option>\n              </select>\n            </div>\n            <div class="fg c2">\n              <label>speaker_num</label>\n              <input id="speakerNum" type="number" placeholder="auto">\n            </div>\n            <div class="fg c4">\n              <label>声纹组 group_ids</label>\n              <input id="realtimeSpeakerGroupIds" placeholder="可选，逗号分隔；默认 default">\n            </div>\n            <div class="fg c4">\n              <label>注册人员 speaker_profile_ids</label>\n              <input id="realtimeSpeakerProfileIds" placeholder="可选，逗号分隔；空表示组内全部人员">\n            </div>\n            <div class="fg c2">\n              <label>vad_threshold</label>\n              <input id="vadThreshold" type="number" step="0.05" placeholder="0.25">\n            </div>\n            <div class="fg c2">\n              <label>vad 静音(ms)</label>\n              <input id="vadMinSilenceMs" type="number" placeholder="500">\n            </div>\n            <div class="fg c4">\n              <label>hotword_id</label>\n              <input id="realtimeHotwordId" value="default">\n            </div>\n            <div class="fg c4">\n              <label>context</label>\n              <input id="realtimeContext" placeholder="可选">\n            </div>\n            <div class="fg c2">\n              <label>输出语种</label>\n              <input id="realtimeAllowedLanguages" value="zh,en" placeholder="zh 或 zh,en">\n            </div>\n            <div class="fg c2">\n              <label>数字转换</label>\n              <select id="realtimeNumberMode">\n                <option value="1" selected>1 - 智能</option>\n                <option value="0">0 - 关闭</option>\n                <option value="3">3 - 数学模式</option>\n              </select>\n            </div>\n            <div class="fg c2">\n              <label>语气词过滤</label>\n              <select id="realtimeFillerMode">\n                <option value="0" selected>0 - 关闭</option>\n                <option value="1">1 - 部分</option>\n                <option value="2">2 - 严格</option>\n              </select>\n            </div>\n            <div class="fg c2">\n              <label>脏词过滤</label>\n              <select id="realtimeProfanityMode">\n                <option value="0" selected>0 - 关闭</option>\n                <option value="1">1 - 删除</option>\n                <option value="2">2 - 替换 *</option>\n              </select>\n            </div>\n          </div>\n        </div>\n\n        <div class="card">\n          <div class="card-header">\n            <div>\n              <div class="card-title">转写结果</div>\n              <div class="card-desc">按 segment_id 增量渲染：单段通过 revision 覆盖，父段与子段的结构性替换通过原子批次一次提交</div>\n            </div>\n            <button class="btn-ghost compact-btn" id="clearSegBtn">清空</button>\n          </div>\n          <div class="viewer-summary realtime-summary" id="realtimeSummary"></div>\n          <div class="live-timeline" id="realtimeTimeline"></div>\n        </div>\n\n        <div class="card">\n          <div class="card-header">\n            <div><div class="card-title">事件日志</div></div>\n            <button class="btn-ghost compact-btn" id="clearRealtimeLogBtn">清空</button>\n          </div>\n          <div class="log-box" id="realtimeLog"></div>\n        </div>\n      </section>\n\n      <section class="panel active" id="panel-offline">\n        <h2 class="section-title">离线异步任务</h2>\n\n        <div class="card">\n          <div class="card-header">\n            <div>\n              <div class="card-title">创建任务</div>\n              <div class="card-desc">URL / 服务器本地路径使用 <code>POST /api/asr/create_task</code></div>\n            </div>\n          </div>\n          <div class="form-grid">\n            <div class="fg c3">\n              <label>SourceType</label>\n              <select id="offlineSourceType">\n                <option value="0">0 - URL</option>\n                <option value="1">1 - 服务器本地路径</option>\n              </select>\n            </div>\n            <div class="fg c9">\n              <label>Url</label>\n              <input id="offlineUrl" placeholder="SourceType=0 时填写，服务器必须能访问该 URL">\n            </div>\n            <div class="fg c12">\n              <label>Extra</label>\n              <input id="offlineExtra" placeholder="SourceType=1 时填写服务器上的绝对路径">\n            </div>\n            <div class="fg c12">\n              <label>CallbackUrl</label>\n              <input id="offlineCallbackUrl" placeholder="可选回调地址">\n            </div>\n            <div class="fg c6">\n              <label>热词选项</label>\n              <select id="offlineHotwordSelect">\n                <option value="">未加载热词</option>\n              </select>\n            </div>\n            <div class="fg c6" style="align-self:end;">\n              <button class="btn-ghost full-width" id="refreshOfflineHotwordsBtn" type="button">刷新热词</button>\n            </div>\n            <div class="fg c6">\n              <label>HotwordId</label>\n              <input id="offlineHotwordId" value="default">\n            </div>\n            <div class="fg c6">\n              <label>Context</label>\n              <input id="offlineContext" placeholder="可选提示词">\n            </div>\n            <div class="fg c3">\n              <label>AllowedOutputLanguages</label>\n              <input id="offlineAllowedLanguages" value="zh,en" placeholder="zh 或 zh,en">\n            </div>\n            <div class="fg c3">\n              <label>NumberNormalizationMode</label>\n              <select id="offlineNumberMode">\n                <option value="1" selected>1 - 智能</option>\n                <option value="0">0 - 关闭</option>\n                <option value="3">3 - 数学模式</option>\n              </select>\n            </div>\n            <div class="fg c3">\n              <label>FillerFilterMode</label>\n              <select id="offlineFillerMode">\n                <option value="0" selected>0 - 关闭</option>\n                <option value="1">1 - 部分</option>\n                <option value="2">2 - 严格</option>\n              </select>\n            </div>\n            <div class="fg c3">\n              <label>ProfanityFilterMode</label>\n              <select id="offlineProfanityMode">\n                <option value="0" selected>0 - 关闭</option>\n                <option value="1">1 - 删除</option>\n                <option value="2">2 - 替换 *</option>\n              </select>\n            </div>\n            <div class="fg c4">\n              <label>GroupIds</label>\n              <textarea id="offlineSpeakerGroupIds" rows="2" placeholder="可选，逗号或换行分隔；空表示 default"></textarea>\n            </div>\n            <div class="fg c4">\n              <label>SpeakerProfileIds</label>\n              <textarea id="offlineSpeakerProfileIds" rows="2" placeholder="可选，逗号或换行分隔；空表示匹配组内全部 active profile"></textarea>\n            </div>\n            <div class="fg c12">\n              <details class="advanced-panel">\n                <summary>说话人分离高级参数（创建任务和上传创建任务共用）</summary>\n                <div class="form-grid">\n                  <div class="fg c3">\n                    <label>EnableSpeakerOverlap</label>\n                    <select id="offlineEnableSpeakerOverlap">\n                      <option value="" selected>服务端默认</option>\n                      <option value="true">true - 开启重叠说话修正</option>\n                      <option value="false">false - 关闭</option>\n                    </select>\n                  </div>\n                  <div class="fg c3">\n                    <label>SpeakerNum</label>\n                    <input id="offlineSpeakerNum" type="number" min="1" step="1" placeholder="已知说话人数，空为自动">\n                  </div>\n                  <div class="fg c3">\n                    <label>SpeakerClusterType</label>\n                    <select id="offlineSpeakerClusterType">\n                      <option value="" selected>服务端默认</option>\n                      <option value="spectral">spectral</option>\n                      <option value="AHC">AHC</option>\n                      <option value="umap_hdbscan">umap_hdbscan</option>\n                    </select>\n                  </div>\n                  <div class="fg c3">\n                    <label>AsrSegmentationMode</label>\n                    <select id="offlineAsrSegmentationMode">\n                      <option value="" selected>服务端默认</option>\n                      <option value="speaker_turn">speaker_turn - 按说话人 turn 切段</option>\n                      <option value="vad_word_align">vad_word_align - VAD/字词时间戳对齐</option>\n                    </select>\n                  </div>\n                  <div class="fg c3">\n                    <label>SpeakerClusterMergeCosineThreshold</label>\n                    <input id="offlineSpeakerClusterMergeCosineThreshold" type="number" min="0.0001" max="1" step="0.01" placeholder="(0, 1]">\n                  </div>\n                  <div class="fg c3">\n                    <label>SpeakerClusterPValue</label>\n                    <input id="offlineSpeakerClusterPValue" type="number" min="0.0001" max="0.9999" step="0.01" placeholder="(0, 1)">\n                  </div>\n                  <div class="fg c2">\n                    <label>MinNumSpeakers</label>\n                    <input id="offlineSpeakerClusterMinNumSpeakers" type="number" min="1" step="1" placeholder="下限">\n                  </div>\n                  <div class="fg c2">\n                    <label>MaxNumSpeakers</label>\n                    <input id="offlineSpeakerClusterMaxNumSpeakers" type="number" min="1" step="1" placeholder="上限">\n                  </div>\n                  <div class="fg c2">\n                    <label>MinClusterSize</label>\n                    <input id="offlineSpeakerClusterMinClusterSize" type="number" min="1" step="1" placeholder="小簇大小">\n                  </div>\n                  <div class="fg c12 card-desc">\n                    留空表示不传该参数，使用服务端配置。<code>SpeakerNum</code> 会同时约束最小和最大说话人数。\n                  </div>\n                </div>\n              </details>\n            </div>\n          </div>\n          <div class="btn-row">\n            <button class="btn-primary" id="createOfflineBtn">创建任务</button>\n          </div>\n        </div>\n\n        <div class="card">\n          <div class="card-header">\n            <div>\n              <div class="card-title">浏览器上传音频</div>\n              <div class="card-desc">对应 <code>POST /api/asr/create_task_upload</code>，文件会保存到服务端 work 目录后创建任务</div>\n            </div>\n          </div>\n          <div class="form-grid">\n            <div class="fg c8">\n              <label>音频文件</label>\n              <input id="uploadFile" type="file" accept=".wav,.mp3,.m4a,.aac,.opus,.pcm,audio/*">\n            </div>\n            <div class="fg c4">\n              <label>上传状态</label>\n              <input id="uploadStatus" value="未选择文件" readonly>\n            </div>\n          </div>\n          <div class="btn-row">\n            <button class="btn-success" id="uploadCreateBtn">上传并创建任务</button>\n          </div>\n        </div>\n\n        <div class="card">\n          <div class="card-header">\n            <div>\n              <div class="card-title">查询与下载</div>\n              <div class="card-desc">查询 <code>GET /api/asr/task_status</code>，下载 <code>GET /api/asr/task_result_download</code></div>\n            </div>\n          </div>\n          <div class="form-grid">\n            <div class="fg c6">\n              <label>TaskId</label>\n              <input id="offlineTaskId" placeholder="创建成功后自动回填">\n            </div>\n            <div class="fg c3">\n              <label>轮询间隔 (ms)</label>\n              <input id="offlinePollMs" type="number" value="3000">\n            </div>\n          </div>\n          <div class="btn-row">\n            <button class="btn-primary" id="queryOfflineBtn">查询状态</button>\n            <button class="btn-warn" id="togglePollBtn">开启自动轮询</button>\n            <button class="btn-danger" id="cancelTaskBtn">取消任务</button>\n            <button class="btn-ghost" id="downloadJsonBtn">下载 JSON</button>\n            <button class="btn-ghost" id="downloadTextBtn">下载文本</button>\n            <button class="btn-ghost" id="downloadRttmBtn">下载 RTTM</button>\n          </div>\n        </div>\n\n        <div class="card">\n          <div class="card-header">\n            <div><div class="card-title">任务日志</div></div>\n            <button class="btn-ghost" id="clearOfflineLogBtn">清空</button>\n          </div>\n          <div class="log-box" id="offlineLog"></div>\n        </div>\n      </section>\n\n      <section class="panel" id="panel-browser">\n        <h2 class="section-title">任务浏览器</h2>\n\n        <div class="card">\n          <div class="card-header">\n            <div>\n              <div class="card-title">已完成任务浏览</div>\n              <div class="card-desc">列表使用 <code>GET /api/asr/task_list</code>，详情和音频使用 <code>/api/asr/task_result</code> 与 <code>/api/asr/task_audio</code></div>\n            </div>\n            <button class="btn-primary" id="refreshTaskListBtn">刷新列表</button>\n          </div>\n\n          <div class="form-grid">\n            <div class="fg c3">\n              <label>状态</label>\n              <select id="browserStatus">\n                <option value="succeeded" selected>已完成</option>\n                <option value="all">全部</option>\n                <option value="queued">排队中</option>\n                <option value="running">运行中</option>\n                <option value="failed">失败</option>\n                <option value="canceled">已取消</option>\n              </select>\n            </div>\n            <div class="fg c2">\n              <label>数量</label>\n              <input id="browserLimit" type="number"     }

    maybeLogMicrophoneClock(true);
    const chunks = realtime.micPcmChunks.slice();
    try {

    } catch {
    }

      } catch {
      }
    }
    try {
      realtime.micProcessor?.disconnect();
    } catch {
    }
    try {
      realtime.micProcessor?.port?.close();
    } catch {
    }
    try {

    } catch {
    }
    realtime.micSource = null;
    realtime.micCaptureInput = null;
    realtime.micFilters = [];
    realtime.micProcessor = null;
    realtime.micSilentGain = null;
    realtime.micResampleToPcm16 = null;
    if (realtime.micStream) realtime.micStream.getTracks().forEach((track) => track.stop());
    realtime.micTrack = null;
    realtime.micStream = null;
    if (realtime.micAudioCtx && realtime.micAudioCtx.state !== "closed") {

      }

      appendLog($("realtimeLog"), `>>> StartSession ${JSON.stringify(startPayload)}`, "log-sent", "info");
      setWsStatus("已连接 · 麦克风", "ok");

      realtime.micPcmChunks = [];

      realtime.micCaptureFrames = 0;
      realtime.micCaptureGapFrames = 0;

      await connectMicrophoneGraph(audioCtx, realtime.micStream, ws);
      realtime.micRecording = true;
      realtime.micClockStartedAt = performance.now();
      realtime.micLastClockLogAt = realtime.micClockStartedAt;
      realtime.micStartTime = Date.now();
      realtime.micTimer = setInterval(updateMicTimer, 500);
      await resumeMicrophoneAudio("capture graph connected");
      appendLog(
        $("realtimeLog"),
        `麦克风采集=${realtime.micCaptureKind}，AudioContext=${realtime.micSampleRate}Hz，WS PCM=${MIC_TARGET_SAMPLE_RATE}Hz；EC/NS/AGC 默认关闭`,
        "log-info",
        "info"
      );

      appendLog($("realtimeLog"), `麦克风采集初始化失败: ${err.message}`, "log-err", "error");

  if (Number.isFinite(audioDuration) && audioDuration > 0) return audioDuration;
  const taskDuration = Number(state.browser.currentTask?.AudioDuration);
  if (Number.isFinite(taskDuration) && taskDuration > 0) return taskDuration;
  const source = state.browser.timelineSegments.length ? state.browser.timelineSegments : state.browser.segments;
  return source.reduce((max, seg) => Math.max(max, seg.end), 0);
}
function setupBrowserCanvases(duration) {
  const width = Math.min(
    Math.max(240, Math.floor(duration * state.browser.pxPerSec)),
    BROWSER_MAX_CANVAS_WIDTH
  );
  const height = 230;
  $("browserTimelineWrap").style.width = `${width}px`;
  $("browserTimelineWrap").style.height = `${height}px`;
  $("browserWave").width = width;
  $("browserWave").height = height;
  $("browserSegmentCanvas").width = width;
  $("browserSegmentCanvas").height = height;
  return { width, height };
}
function drawBrowserWaveform() {
  const duration = getBrowserDuration();
  if (!duration) {
    setupBrowserCanvases(3);
    $("browserWave").getContext("2d").clearRect(0, 0, $("browserWave").width, $("browserWave").height);
    $("browserSegmentCanvas").getContext("2d").clearRect(0, 0, $("browserSegmentCanvas").width, $("browserSegmentCanvas").height);
    $("browserPlayhead").style.left = "0px";
    return;
  }
  const { width, height } = setupBrowserCanvases(duration);
  const ctx = $("browserWave").getContext("2d");
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = "#09090b";
  ctx.fillRect(0, 0, width, height);
  const audioBuffer = state.browser.audioBuffer;
  const mid = height / 2;
  if (!audioBuffer) {
    ctx.beginPath();
    ctx.moveTo(0, mid);
    ctx.lineTo(width, mid);
    ctx.strokeStyle = "#3f3f46";
    ctx.stroke();
    drawBrowserSegmentCanvas(duration);
    updateBrowserPlayhead();
    return;
  }
  const channelData = audioBuffer.getChannelData(0);
  const samplesPerPixel = Math.max(1, Math.floor(channelData.length / width));
  ctx.beginPath();
  for (let x = 0; x < width; x++) {
    const start = x * samplesPerPixel;
    let min = 1;
    let max = -1;
    for (let i = 0; i < samplesPerPixel; i++) {
      const v = channelData[start + i] || 0;
      if (v < min) min = v;
      if (v > max) max = v;
    }
    ctx.moveTo(x, mid + min * mid);
    ctx.lineTo(x, mid + max * mid);
  }
  ctx.strokeStyle = "#d4d4d8";
  ctx.stroke();
  drawBrowserSegmentCanvas(duration);
  updateBrowserPlayhead();
}
function drawBrowserSegmentCanvas(duration = getBrowserDuration()) {
  const canvas = $("browserSegmentCanvas");
  const width = canvas.width;
  const height = canvas.height;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, width, height);
  if (!duration) return;
  const separated = state.browser.timelineMode === "tracks";
  const speakers = browserSpeakers();
  const laneHeight = speakers.length ? height / speakers.length : height;
  state.browser.timelineSegments.forEach((seg) => {
    const x = Math.max(0, seg.start / duration * width);
    const w = Math.max(1, (seg.end - seg.start) / duration * width);
    const lane = Math.max(0, speakers.indexOf(seg.speaker));
    const y = separated ? lane * laneHeight + 1 : 0;
    const h = separated ? Math.max(1, laneHeight - 2) : height;
    ctx.fillStyle = browserSpeakerColor(seg.speaker);
    ctx.globalAlpha = separated ? 0.5 : 0.34;
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 1;
  });
  if (separated) {
    browserOverlapRegions().forEach((region) => {
      const x = Math.max(0, region.start / duration * width);
      const w = Math.max(2, (region.end - region.start) / duration * width);
      ctx.fillStyle = "#facc15";
      ctx.fillRect(x, 0, w, 4);
      ctx.strokeStyle = "rgba(250, 204, 21, 0.8)";
      ctx.strokeRect(x + 0.5, 0.5, Math.max(1, w - 1), height - 1);
    });
  } else {
    browserOverlapSlices().forEach((region) => {
      const x = Math.max(0, region.start / duration * width);
      const w = Math.max(1, (region.end - region.start) / duration * width);
      ctx.clearRect(x, 0, w, height);
      region.speakers.forEach((speaker) => {
        ctx.fillStyle = browserSpeakerColor(speaker);
        ctx.globalAlpha = 0.18;
        ctx.fillRect(x, 0, w, height);
      });
      const stripeWidth = 9;
      const stripeCycle = stripeWidth * region.speakers.length;
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, 0, w, height);
      ctx.clip();
      ctx.lineWidth = stripeWidth + 1;
      ctx.globalAlpha = 0.72;
      region.speakers.forEach((speaker, index) => {
        ctx.strokeStyle = browserSpeakerColor(speaker);
        for (let offset = -height + index * stripeWidth; offset < w + height; offset += stripeCycle) {
          ctx.beginPath();
          ctx.moveTo(x + offset, height);
          ctx.lineTo(x + offset + height, 0);
          ctx.stroke();
        }
      });
      ctx.restore();
      ctx.globalAlpha = 1;
    });
  }
}
function hideBrowserTimelineTooltip() {
  $("browserTimelineTooltip").hidden = true;
}
function updateBrowserTimelineTooltip(event) {
  const duration = getBrowserDuration();
  const width = $("browserWave").width;
  if (!duration || !width) {
    hideBrowserTimelineTooltip();
    return;
  }
  const wrap = $("browserTimelineWrap");
  const rect = wrap.getBoundingClientRect();
  const x = event.clientX - rect.left;
  if (x < 0 || x > width) {
    hideBrowserTimelineTooltip();
    return;
  }
  const time = x / width * duration;
  const speakers = [...new Set(state.browser.timelineSegments.filter((seg) => time >= seg.start && time < seg.end).map((seg) => seg.speaker))];
  const tooltip = $("browserTimelineTooltip");
  tooltip.innerHTML = `
        <div class="timeline-tooltip-time">${esc(formatBrowserTime(time))}</div>
        <div class="timeline-tooltip-speakers">
          ${speakers.length ? speakers.map((speaker) => `
            <span><i style="background:${browserSpeakerColor(speaker)}"></i>${esc(browserSpeakerLabel(speaker))}</span>
          `).join("") : "<span>无说话人</span>"}
        </div>
      `;
  tooltip.hidden = false;
  const scroll = $("browserScroll");
  const tooltipWidth = tooltip.offsetWidth;
  const visibleRight = scroll.scrollLeft + scroll.clientWidth;
  const left = x + tooltipWidth + 16 > visibleRight ? Math.max(scroll.scrollLeft + 8, x - tooltipWidth - 12) : x + 12;
  tooltip.style.left = `${left}px`;
  tooltip.style.top = "10px";
}
function setBrowserTimelineMode(mode) {
  hideBrowserTimelineTooltip();
  state.browser.timelineMode = mode === "tracks" ? "tracks" : "merged";
  qsa("#browserTimelineMode button").forEach((button) => {
    const active = button.dataset.mode === state.browser.timelineMode;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
  renderBrowserLegend();
  drawBrowserSegmentCanvas();
}
function updateBrowserPlayhead() {
  const duration = getBrowserDuration();
  const width = $("browserWave").width;
  if (!duration || !width) return;
  const player = $("browserPlayer");
  const time = Math.max(0, Number(player.currentTime || 0));
  const x = Math.min(width, Math.max(0, time / duration * width));
  $("browserPlayhead").style.left = `${x}px`;
  const scroll = $("browserScroll");
  const viewWidth = scroll.clientWidth;
  const leftBound = scroll.scrollLeft + viewWidth * 0.1;
  const rightBound = scroll.scrollLeft + viewWidth * 0.9;
  if (x < leftBound) {
    scroll.scrollLeft = Math.max(0, x - viewWidth * 0.1);
  } else if (x > rightBound) {
    scroll.scrollLeft = Math.max(0, x - viewWidth * 0.9);
  }
  highlightBrowserSegment(time);
  const playingSeg = state.browser.playSegment;
  if (playingSeg && time >= playingSeg.end - 0.03) {
    player.pause();
    state.browser.playSegment = null;
  }
}
function highlightBrowserSegment(time) {
  const activeIndex = state.browser.segments.findIndex((seg) => time >= seg.start && time < seg.end);
  qsa("#browserSegmentList .segment-row").forEach((row) => {
    row.classList.toggle("active", Number(row.dataset.index) === activeIndex);
  });
}
function seekBrowserSegment(index, play) {
  const seg = state.browser.segments[index];
  if (!seg) return;
  const player = $("browserPlayer");
  player.currentTime = seg.start;
  state.browser.playSegment = play ? seg : null;
  updateBrowserPlayhead();
  if (play) {
    if (!player.src) {
      toast("当前任务没有可播放音频", "error");
      return;
    }
    player.play().catch((err) => toast(`播放失败: ${err.message}`, "error"));
  }
}
async function loadBrowserTask(taskId) {
  const safeTaskId = String(taskId || "").trim();
  if (!safeTaskId) {
    toast("请填写 TaskId", "error");
    return;
  }
  const generation = ++browserLoadGeneration;
  state.browser.selectedTaskId = safeTaskId;
  $("browserTaskId").value = safeTaskId;
  renderTaskList();
  $("browserEmpty").hidden = true;
  $("browserViewer").hidden = false;
  setBrowserViewerStatus("加载任务详情...");
  clearBrowserAudio();
  clearOverlapPreviewCache();
  state.browser.currentTask = null;
  state.browser.segments = [];
  state.browser.timelineSegments = [];
  state.browser.overlapPreviewRegions = [];
  state.browser.speakerMatches = [];
  state.browser.profileEnrollments = {};
  updateBrowserRttmButton(null);
  renderBrowserSummary({});
  renderBrowserLegend();
  renderBrowserSpeakerMatches();
  renderBrowserSegments();
  drawBrowserWaveform();
  try {
    const res = await httpJson(`/api/asr/task_result?TaskId=${encodeURIComponent(safeTaskId)}`);
    if (!isCurrentBrowserLoad(generation, safeTaskId)) return;
    if (!res.ok || res?.json?.Response?.Error) throw new Error(apiErrorMessage(res));
    const task = dataOrNull(res);
    state.browser.currentTask = task;
    state.browser.speakerMatches = Array.isArray(task?.SpeakerProfileMatches) ? task.SpeakerProfileMatches : [];
    state.browser.profileEnrollments = {};
    state.browser.segments = normalizeBrowserSegments(task);
    state.browser.timelineSegments = normalizeBrowserTimelineSegments(task, state.browser.segments);
    state.browser.overlapPreviewRegions = normalizeOverlapPreviewRegions(task);
    updateBrowserRttmButton(task);
    renderBrowserSummary(task);
    renderBrowserLegend();
    renderBrowserSpeakerMatches();
    renderBrowserSegments();
    drawBrowserWaveform();
    void loadMatchedProfileEnrollments(state.browser.speakerMatches, generation, safeTaskId);
    try {
      setBrowserViewerStatus("加载音频...");
      const loaded = await loadBrowserAudio(safeTaskId, generation);
      if (!loaded || !isCurrentBrowserLoad(generation, safeTaskId)) return;
      setBrowserViewerStatus(`已加载 ${state.browser.segments.length} 段识别结果`);
    } catch (audioErr) {
      if (!isCurrentBrowserLoad(generation, safeTaskId)) return;
      resetBrowserAudioProgress();
      const prefix = state.browser.audioPlayable ? "音频可试听，波形不可用" : "播放器已直连音频接口，等待浏览器加载";
      setBrowserViewerStatus(`${prefix}: ${audioFetchMessage(audioErr)}`);
    }
    drawBrowserWaveform();
  } catch (err) {
    if (!isCurrentBrowserLoad(generation, safeTaskId)) return;
    state.browser.currentTask = null;
    state.browser.segments = [];
    state.browser.timelineSegments = [];
    state.browser.overlapPreviewRegions = [];
    state.browser.speakerMatches = [];
    state.browser.profileEnrollments = {};
    updateBrowserRttmButton(null);
    renderBrowserSummary({});
    renderBrowserLegend();
    renderBrowserSpeakerMatches();
    renderBrowserSegments();
    drawBrowserWaveform();
    setBrowserViewerStatus(`加载失败: ${err.message}`);
    toast(`任务加载失败: ${err.message}`, "error");
  }
}
function seekFromTimelineClick(event) {

  const width = $("browserWave").width;

function registerTaskBrowser() {

  $("browserLimit").addEventListener("change", refreshTaskList);

      display: block;
      width: 100%;
      min-width: 0;
      height: 34px;
    }
    .segment-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      max-height: 420px;
      overflow: auto;
    }
    .segment-row {
      display: grid;
      grid-template-columns: 118px minmax(130px, 220px) minmax(0, 1fr) auto;
      gap: 10px;

      background: var(--panel-2);
      padding: 10px;
    }

      min-width: 0;

      line-height: 1.5;
      overflow-wrap: anywhere;
    }

      align-items: center;

      gap: 6px;

      padding: 7px 9px;
      font-size: 12px;
      white-space: nowrap;
    }
    .speaker-meta {
      display: grid;
      gap: 4px;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .speaker-name {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.35;
      white-space: normal;
      overflow-wrap: anywhere;

      font-size: 12px;
      overflow-wrap: anywhere;

    .match-badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .match-badge.matched { color: var(--green); border-color: rgba(34,197,94,.42); }
    .match-badge.active { color: var(--green); border-color: rgba(34,197,94,.42); }
    .match-badge.unknown { color: var(--yellow); border-color: rgba(234,179,8,.42); }

    .profile-list, .match-list {

      margin-bottom: 8px;
